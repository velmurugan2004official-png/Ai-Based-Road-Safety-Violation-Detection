
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Road Safety System</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #101827;
            color: #f1f5f9;
            font-family: Arial, sans-serif;
        }
        .card {
            width: min(90%, 400px);
            padding: 30px;
            border: 1px solid #334155;
            border-radius: 16px;
            background: #1e293b;
        }
        h1 { margin-top: 0; }
        p { color: #cbd5e1; }
        label { display: block; margin: 16px 0 6px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #38bdf8;
            color: #082f49;
            font-weight: bold;
            cursor: pointer;
        }
        .message { padding: 10px; border-radius: 8px; background: #334155; }
        a { color: #7dd3fc; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Road Safety System</h1>
        <p>Sign in to continue to the dashboard.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Username</label>
            <input id="username" name="username"
                   type="text" maxlength="80" required
                   autocomplete="username">

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" required
                   autocomplete="current-password">

            <button type="submit">Login</button>
        </form>

        <p>New officer? <a href="{{ url_for('register') }}">Create an account</a></p>
    </main>
</body>
</html>
